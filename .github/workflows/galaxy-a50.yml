name: CuteCat Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - "android-14.0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Update Debian/Ubuntu Repositories
        run: sudo apt-get update

      - name: Install Debian/Ubuntu dependencies
        run: |
          sudo apt-get install -y flex libncurses-dev libncurses5-dev libncursesw5-dev fakeroot rsync kmod xz-utils \
          lz4 openssl python3 device-tree-compiler pahole dialog bash sed wget git curl zip tar jq expect make \
          cmake automake autoconf binutils apt-utils perl gperf gawk bc zstd unzip cpio bison build-essential \
          ccache liblz4-tool libsdl1.2-dev libstdc++6 libxml2 libxml2-utils lzop pngcrush schedtool squashfs-tools \
          xsltproc zlib1g-dev bzip2 libssl-dev dwarves libelf-dev dos2unix python-is-python3 git gh git-lfs nano

      - name: Set kernel name
        run: echo "KERNEL_NAME=CuteCat" >> $GITHUB_ENV

      - name: Set build environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "ANDROID_MAJOR_VERSION=r" >> $GITHUB_ENV
          echo "PLATFORM_VERSION=11.0.0" >> $GITHUB_ENV

      - name: Fetch toolchain
        run: |
          set -eo pipefail
          git clone https://gitlab.com/TenSeventy7/exynos9610_toolchains_fresh.git toolchain --single-branch -b proton --depth 1
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/toolchain/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: Update KernelSU submodule
        run: git submodule update --init "$GITHUB_WORKSPACE/KernelSU"

      - name: Generate defconfig
        run: |
          set -eo pipefail
          make CC=clang HOSTCC=clang HOSTCXX=clang++ AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip exynos9610-a50_core_defconfig

      - name: Disable Knox and root detection protections
        run: |
          set -eo pipefail
          scripts/config --file .config \
            --disable CONFIG_UH \
            --disable CONFIG_RKP \
            --disable CONFIG_KDP \
            --disable CONFIG_SECURITY_DEFEX \
            --disable CONFIG_PROCA \
            --disable CONFIG_FIVE \
            --disable CONFIG_TIMA_RKP \
            --disable CONFIG_TIMA \
            --disable CONFIG_TZDEV \
            --disable CONFIG_FIVE_HASH_SHA256 \
            --disable CONFIG_KDP_CRED \
            --disable CONFIG_KDP_NS \
            --disable CONFIG_SECURITY_DEFEX_DEBUG \
            --enable CONFIG_KALLSYMS_ALL
          make CC=clang HOSTCC=clang HOSTCXX=clang++ AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip olddefconfig
          grep -q "^CONFIG_KALLSYMS_ALL=y$" .config || (echo "CONFIG_KALLSYMS_ALL was not set, aborting" && exit 1)

      - name: Build kernel
        run: |
          set -eo pipefail
          make CC=clang HOSTCC=clang HOSTCXX=clang++ AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip -j$(nproc) LOCALVERSION="-$KERNEL_NAME"

      - name: Build ramdisk
        run: |
          set -eo pipefail
          cd tools/make/ramdisk
          find . | cpio -R 0:0 -H newc --quiet -o | cat > ../ramdisk-new.cpio
          cd "$GITHUB_WORKSPACE"

      - name: Build boot image
        run: |
          set -eo pipefail
          mkdir -p out
          tools/make/bin/mkbootimg \
            --kernel arch/arm64/boot/Image \
            --ramdisk tools/make/ramdisk-new.cpio \
            --cmdline "androidboot.selinux=permissive loop.max_part=7" \
            --board "" \
            --base 0x10000000 \
            --pagesize 2048 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --second_offset 0xf0000000 \
            --tags_offset 0x00000100 \
            --os_version "$PLATFORM_VERSION" \
            --os_patch_level "$(date +%Y-%m)" \
            --header_version 1 \
            -o out/boot.img

      - name: Prepare release package
        run: |
          set -eo pipefail
          mkdir -p ./release
          cp out/boot.img ./release/
          cp .config ./release/kernel_config_${KERNEL_NAME}.txt

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }} Kernel Image
          path: "release/boot.img"
          if-no-files-found: error

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }} Release
          path: "release"
          if-no-files-found: error

  release:
    name: Release kernel
    if: ${{ !contains(github.event.head_commit.message, '[skip rel]') }}
    needs: build
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v3

      - name: Download release artifact
        run: |
          set -eo pipefail
          gh run download "$GITHUB_RUN_ID" -p "CuteCat Release" --dir ./release

      - name: Upload release
        uses: Hs1r1us/Release-AIO@v1.0
        with:
          tag_name: cutecat-${{ github.run_number }}_a50
          prerelease: true
          release_name: CuteCat Kernel
          asset_files: "./release"
